<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeverse — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&family=Amiri:wght@500;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-950:#1c3626;
    --green-900:#234631;
    --green-800:#2f5a41;
    --green-700:#3d6d51;
    --beige-50:#faf6ee;
    --beige-100:#f1e8d6;
    --beige-200:#e3d5b3;
    --gold-500:#1c3626;
    --gold-600:#12261a;
    --ink:#241f16;
    --white:#ffffff;
    --danger:#a13d3d;
    --radius-s:2px;
    --radius-m:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--beige-50);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  html[lang="ar"] body{font-family:'Tajawal',sans-serif;}
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif; font-weight:600; letter-spacing:.01em;}
  html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .serif{font-family:'Amiri',serif; font-weight:700;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  img{max-width:100%; display:block;}
  .container{max-width:1180px; margin:0 auto; padding:0 24px;}
  ::selection{background:var(--gold-500); color:#fff;}

  /* ---------- HEADER ---------- */
  header.site-header{
    position:sticky; top:0; z-index:60;
    background:var(--beige-50);
    color:var(--green-950);
    border-bottom:1px solid var(--beige-200);
  }
  .header-row{
    display:flex; align-items:center; justify-content:space-between;
    height:76px; gap:20px;
  }
  .brand{
    display:flex; align-items:center; white-space:nowrap;
  }
  .brand-text{
    font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:34px; letter-spacing:.06em; color:var(--green-900);
    text-transform:uppercase;
  }
  nav.main-nav{display:flex; gap:28px; align-items:center;}
  nav.main-nav a{
    font-size:14.5px; letter-spacing:.02em; color:var(--green-800);
    position:relative; padding:6px 0; transition:color .2s ease;
  }
  nav.main-nav a:hover, nav.main-nav a.active{color:var(--gold-500);}
  nav.main-nav a.active::after{
    content:""; position:absolute; left:0; right:0; bottom:-2px; height:1px; background:var(--gold-500);
  }
  .header-icons{display:flex; align-items:center; gap:16px;}
  .icon-btn{
    background:none; border:none; color:var(--green-900); position:relative;
    display:flex; align-items:center; justify-content:center; width:34px; height:34px;
    border-radius:50%; transition:background .2s ease;
  }
  .icon-btn:hover{background:var(--beige-200);}
  .cart-badge{
    position:absolute; top:-2px; right:-2px; background:var(--gold-500); color:#fff;
    font-size:10px; font-weight:600; width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  html[dir="rtl"] .cart-badge{right:auto; left:-2px;}
  .lang-toggle{
    display:flex; border:1px solid var(--beige-200); border-radius:20px; overflow:hidden;
  }
  .lang-toggle button{
    background:none; border:none; color:var(--green-800); font-size:12px; padding:6px 12px;
    letter-spacing:.05em;
  }
  .lang-toggle button.active{background:var(--gold-500); color:#fff;}
  .search-bar{
    display:none; padding:12px 0; border-top:1px solid var(--beige-200);
  }
  .search-bar.open{display:block;}
  .search-bar input{
    width:100%; background:var(--beige-100); border:1px solid var(--beige-200); color:var(--green-950);
    padding:10px 16px; border-radius:22px; font-size:14px; outline:none;
  }
  .search-bar input::placeholder{color:var(--green-800); opacity:.6;}
  .mobile-nav-toggle{display:none; background:none; border:none; color:var(--green-900);}
  .mobile-nav-panel{display:none; flex-direction:column; border-top:1px solid var(--beige-200);}
  .mobile-nav-panel.open{display:flex;}
  .mobile-nav-panel a{padding:14px 4px; font-size:15px; color:var(--green-900); border-bottom:1px solid var(--beige-100);}
  .mobile-nav-panel a.active{color:var(--gold-500); font-weight:600;}

  /* ---------- HERO ---------- */
  .hero{position:relative; overflow:hidden; background:var(--beige-100); color:var(--green-950);}
  .hero-inner{
    display:grid; grid-template-columns:1fr 1fr; align-items:stretch; min-height:560px;
  }
  .hero-text{
    display:flex; flex-direction:column; justify-content:center; gap:20px;
    padding:60px 48px; z-index:2;
  }
  .hero-eyebrow{font-size:13px; letter-spacing:.14em; color:var(--gold-500);}
  .hero-title{font-size:52px; line-height:1.06; margin:0; color:var(--green-950);}
  .hero-sub{font-size:16px; line-height:1.7; color:#5a5140; max-width:420px; font-weight:300;}
  html[lang="ar"] .hero-sub{font-weight:400;}
  .hero-cta{display:flex; gap:14px; margin-top:6px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 30px; border-radius:2px; font-size:13.5px; letter-spacing:.05em;
    border:1px solid transparent; transition:all .2s ease; white-space:nowrap;
  }
  .btn-gold{background:var(--gold-500); color:#fff;}
  .btn-gold:hover{background:var(--gold-600);}
  .btn-outline-light{border-color:var(--green-950); color:var(--green-950);}
  .btn-outline-light:hover{background:var(--green-950); color:var(--beige-50);}
  .btn-dark{background:var(--green-950); color:var(--beige-50);}
  .btn-dark:hover{background:var(--green-800);}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 16px; font-size:12.5px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .hero-image-wrap{position:relative;}
  .hero-image-wrap img{width:100%; height:100%; object-fit:cover; object-position:top center;}
  .hero-image-wrap::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, var(--beige-100) 0%, rgba(241,232,214,0) 18%);
  }

  /* ---------- CATEGORIES ---------- */
  .section{padding:76px 0;}
  .section-head{text-align:center; margin-bottom:44px;}
  .section-eyebrow{font-size:12.5px; letter-spacing:.14em; color:var(--gold-600); margin-bottom:10px;}
  .section-title{font-size:34px; margin:0 0 10px;}
  .section-desc{color:#5a5a52; font-size:15px; max-width:520px; margin:0 auto; font-weight:300;}

  .cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
  .cat-card{
    position:relative; aspect-ratio:3/4; overflow:hidden; border-radius:2px; cursor:pointer;
    background:var(--green-800); color:var(--beige-50); display:flex; align-items:flex-end;
  }
  .cat-card img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .5s ease;}
  .cat-card:hover img{transform:scale(1.05);}
  .cat-card .cat-overlay{
    position:relative; z-index:2; padding:20px; width:100%;
    background:linear-gradient(0deg, rgba(15,35,24,.82) 0%, rgba(15,35,24,0) 60%);
  }
  .cat-card.no-image{background:linear-gradient(160deg, var(--green-800), var(--green-950));}
  .cat-name{font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600;}
  html[lang="ar"] .cat-name{font-family:'Jost',sans-serif; font-weight:500;}
  .cat-count{font-size:11.5px; color:var(--beige-200); letter-spacing:.04em; margin-top:2px;}

  /* ---------- PRODUCTS ---------- */
  .tabs-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:36px;}
  .tab-btn{
    padding:9px 20px; border:1px solid var(--green-800); border-radius:20px; background:transparent;
    color:var(--green-900); font-size:13px; letter-spacing:.03em; transition:all .2s ease;
  }
  .tab-btn.active, .tab-btn:hover{background:var(--green-900); color:var(--beige-50);}

  .prod-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:26px 22px;}
  .prod-card{background:var(--white); border:1px solid var(--beige-200); display:flex; flex-direction:column;}
  .prod-img-wrap{position:relative; aspect-ratio:3/4; overflow:hidden; background:var(--beige-200); cursor:pointer;}
  .prod-img-wrap img{width:100%; height:100%; object-fit:cover; transition:transform .4s ease;}
  .prod-card:hover .prod-img-wrap img{transform:scale(1.04);}
  .badge-promo{
    position:absolute; top:10px; left:10px; background:var(--danger); color:#fff; font-size:11px;
    padding:4px 9px; letter-spacing:.03em; border-radius:2px;
  }
  html[dir="rtl"] .badge-promo{left:auto; right:10px;}
  .prod-body{padding:16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .prod-cat{font-size:11px; letter-spacing:.08em; color:var(--gold-600); text-transform:uppercase;}
  .prod-name{font-size:16.5px; font-family:'Cormorant Garamond',serif; font-weight:600; line-height:1.3;}
  html[lang="ar"] .prod-name{font-family:'Jost',sans-serif; font-weight:500;}
  .prod-price-row{display:flex; align-items:baseline; gap:9px; margin-top:2px;}
  .price-now{font-size:16px; font-weight:600; color:var(--green-950);}
  .price-old{font-size:13px; color:#9a9488; text-decoration:line-through;}
  .prod-actions{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:10px;}
  .empty-cat{
    text-align:center; padding:70px 20px; color:#7c7669; border:1px dashed var(--beige-200);
  }

  /* ---------- FOOTER ---------- */
  footer{background:var(--green-950); color:var(--beige-200); padding:56px 0 24px; margin-top:40px;}
  .footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:40px; margin-bottom:40px;}
  .footer-brand{font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--beige-50); margin-bottom:12px;}
  html[lang="ar"] .footer-brand{font-family:'Amiri',serif;}
  .footer-desc{font-size:13.5px; line-height:1.7; color:var(--beige-200); opacity:.8; max-width:280px;}
  .footer-col h4{font-size:13px; letter-spacing:.08em; color:var(--beige-50); margin:0 0 16px; font-weight:500; text-transform:uppercase;}
  .footer-col a, .footer-col span{display:block; font-size:13.5px; margin-bottom:10px; opacity:.85;}
  .footer-bottom{border-top:1px solid var(--green-800); padding-top:20px; display:flex; justify-content:space-between; font-size:12px; opacity:.6; flex-wrap:wrap; gap:10px;}
  .admin-link{opacity:.5; font-size:11.5px;}

  /* ---------- CART DRAWER ---------- */
  .overlay{position:fixed; inset:0; background:rgba(15,20,15,.5); z-index:90; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; bottom:0; right:-420px; width:400px; max-width:92vw; background:var(--beige-50);
    z-index:95; display:flex; flex-direction:column; transition:right .3s ease; box-shadow:-6px 0 30px rgba(0,0,0,.15);
  }
  html[dir="rtl"] .drawer{right:auto; left:-420px; transition:left .3s ease;}
  .drawer.show{right:0;}
  html[dir="rtl"] .drawer.show{left:0;}
  .drawer-head{
    display:flex; justify-content:space-between; align-items:center; padding:20px 22px;
    border-bottom:1px solid var(--beige-200); background:var(--green-950); color:var(--beige-50);
  }
  .drawer-body{flex:1; overflow-y:auto; padding:16px 22px;}
  .cart-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--beige-200);}
  .cart-item img{width:66px; height:80px; object-fit:cover; border-radius:2px;}
  .cart-item-info{flex:1; display:flex; flex-direction:column; gap:6px;}
  .qty-row{display:flex; align-items:center; gap:10px;}
  .qty-btn{width:24px; height:24px; border:1px solid var(--beige-200); background:#fff; border-radius:50%; font-size:14px; line-height:1;}
  .remove-link{font-size:12px; color:var(--danger); align-self:flex-start; margin-top:2px;}
  .drawer-foot{padding:20px 22px; border-top:1px solid var(--beige-200); background:#fff;}
  .cart-total-row{display:flex; justify-content:space-between; font-size:16px; margin-bottom:14px; font-weight:600;}

  /* ---------- MODAL ---------- */
  .modal{
    position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal.show{display:flex;}
  .modal-backdrop{position:absolute; inset:0; background:rgba(15,20,15,.6);}
  .modal-box{
    position:relative; background:#fff; max-width:920px; width:100%; max-height:88vh; overflow-y:auto;
    border-radius:2px; z-index:2;
  }
  .modal-box.narrow{max-width:480px;}
  .modal-close{position:absolute; top:14px; right:14px; background:none; border:none; font-size:22px; color:#555; z-index:5;}
  html[dir="rtl"] .modal-close{right:auto; left:14px;}
  .product-detail{display:grid; grid-template-columns:1fr 1fr;}
  .pd-gallery-main{aspect-ratio:3/4; overflow:hidden; background:var(--beige-100);}
  .pd-gallery-main img{width:100%; height:100%; object-fit:cover;}
  .pd-thumbs{display:flex; gap:8px; padding:10px; flex-wrap:wrap;}
  .pd-thumb{width:56px; height:68px; object-fit:cover; border:2px solid transparent; cursor:pointer; opacity:.7;}
  .pd-thumb.active{border-color:var(--gold-500); opacity:1;}
  .pd-info{padding:34px; display:flex; flex-direction:column; gap:14px;}
  .pd-desc{font-size:14px; line-height:1.7; color:#4a463d; font-weight:300;}
  .pd-qty{display:flex; align-items:center; gap:14px;}

  form .field{margin-bottom:16px; display:flex; flex-direction:column; gap:6px;}
  form label{font-size:12.5px; letter-spacing:.03em; color:#5a5a52;}
  form input, form select, form textarea{
    padding:11px 14px; border:1px solid var(--beige-200); border-radius:2px; font-size:14px; font-family:inherit;
    background:#fff; outline:none; color:var(--ink);
  }
  form input:focus, form select:focus, form textarea:focus{border-color:var(--gold-500);}
  form textarea{resize:vertical; min-height:80px;}
  .form-box{padding:34px;}
  .form-title{margin:0 0 6px;}
  .form-row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  /* ---------- ADMIN ---------- */
  .admin-shell{display:flex; min-height:100vh; background:var(--beige-100);}
  .admin-sidebar{width:230px; background:var(--green-950); color:var(--beige-200); padding:26px 0; flex-shrink:0;}
  .admin-brand{padding:0 24px 24px; font-family:'Cormorant Garamond',serif; font-size:22px; color:#fff; border-bottom:1px solid var(--green-800); margin-bottom:14px;}
  .admin-nav-item{
    display:flex; align-items:center; gap:10px; padding:12px 24px; font-size:13.5px; cursor:pointer;
    border-left:3px solid transparent; opacity:.8;
  }
  html[dir="rtl"] .admin-nav-item{border-left:none; border-right:3px solid transparent;}
  .admin-nav-item:hover{background:var(--green-900); opacity:1;}
  .admin-nav-item.active{background:var(--green-900); border-color:var(--gold-500); opacity:1; color:#fff;}
  .admin-main{flex:1; padding:36px 40px; overflow-y:auto;}
  .admin-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
  .admin-card{background:#fff; border:1px solid var(--beige-200); padding:24px; margin-bottom:20px;}
  table.admin-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.admin-table th{text-align:left; padding:10px 12px; background:var(--beige-100); font-weight:500; letter-spacing:.02em; font-size:12px; text-transform:uppercase; color:#5a5a52;}
  html[dir="rtl"] table.admin-table th{text-align:right;}
  table.admin-table td{padding:12px; border-bottom:1px solid var(--beige-100); vertical-align:middle;}
  table.admin-table img{width:44px; height:54px; object-fit:cover;}
  .row-actions{display:flex; gap:10px;}
  .link-btn{background:none; border:none; color:var(--gold-600); font-size:13px; padding:0;}
  .link-btn.danger{color:var(--danger);}
  .admin-login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--green-950);}
  .admin-login-box{background:#fff; padding:44px; width:380px; max-width:90vw; border-radius:2px;}
  .thumb-strip{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .thumb-chip{position:relative; width:56px; height:68px;}
  .thumb-chip img{width:100%; height:100%; object-fit:cover;}
  .thumb-chip .x{position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff; width:16px; height:16px; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .file-drop{border:1px dashed var(--beige-200); padding:14px; text-align:center; font-size:12.5px; color:#7c7669; cursor:pointer; border-radius:2px;}
  .badge-status{padding:3px 9px; font-size:11px; border-radius:10px; letter-spacing:.02em;}
  .badge-new{background:#e7f1ea; color:#2a6b45;}
  .badge-done{background:var(--beige-100); color:#7c7669;}
  .notice{background:#fbf3e3; border:1px solid #ecd8a5; padding:12px 16px; font-size:12.5px; color:#7a5c15; margin-bottom:20px; border-radius:2px;}
  .hint{font-size:11.5px; color:#9a9488;}

  /* ---------- CHAT WIDGET ---------- */
  .chat-fab{
    position:fixed; bottom:24px; right:24px; z-index:80; width:58px; height:58px; border-radius:50%;
    background:var(--green-950); color:var(--beige-50); border:1px solid var(--gold-500);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(15,35,24,.35);
  }
  html[dir="rtl"] .chat-fab{right:auto; left:24px;}
  .chat-panel{
    position:fixed; bottom:94px; right:24px; width:340px; max-width:90vw; height:440px; background:#fff;
    z-index:80; display:none; flex-direction:column; border-radius:4px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  html[dir="rtl"] .chat-panel{right:auto; left:24px;}
  .chat-panel.show{display:flex;}
  .chat-head{background:var(--green-950); color:#fff; padding:14px 18px; font-size:14px;}
  .chat-head small{display:block; color:var(--beige-200); font-weight:300; margin-top:2px; font-size:11px;}
  .chat-body{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--beige-50);}
  .chat-msg{max-width:84%; padding:9px 13px; font-size:13px; line-height:1.5; border-radius:10px;}
  .chat-msg.user{align-self:flex-end; background:var(--gold-500); color:#fff; border-bottom-right-radius:2px;}
  html[dir="rtl"] .chat-msg.user{align-self:flex-start; border-bottom-right-radius:10px; border-bottom-left-radius:2px;}
  .chat-msg.bot{align-self:flex-start; background:#fff; border:1px solid var(--beige-200); border-bottom-left-radius:2px;}
  html[dir="rtl"] .chat-msg.bot{align-self:flex-end; border-bottom-left-radius:10px; border-bottom-right-radius:2px;}
  .chat-input-row{display:flex; border-top:1px solid var(--beige-200);}
  .chat-input-row input{flex:1; border:none; padding:12px 14px; font-size:13px; outline:none;}
  .chat-input-row button{background:var(--green-950); color:#fff; border:none; padding:0 18px;}
  .chat-typing{font-size:12px; color:#9a9488; font-style:italic;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--green-950);
    color:#fff; padding:14px 24px; border-radius:3px; font-size:13.5px; z-index:200; opacity:0; pointer-events:none;
    transition:all .3s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:980px){
    .hero-inner{grid-template-columns:1fr; min-height:auto;}
    .hero-image-wrap{aspect-ratio:4/3;}
    .hero-image-wrap::before{background:linear-gradient(180deg, var(--beige-100) 0%, rgba(241,232,214,0) 25%);}
    .hero-text{padding:44px 24px;}
    .hero-title{font-size:38px;}
    .cat-grid{grid-template-columns:repeat(2,1fr);}
    .prod-grid{grid-template-columns:repeat(2,1fr);}
    nav.main-nav{display:none;}
    .mobile-nav-toggle{display:flex; align-items:center;}
    .footer-grid{grid-template-columns:1fr; gap:28px;}
    .product-detail{grid-template-columns:1fr;}
    .admin-shell{flex-direction:column;}
    .admin-sidebar{width:100%; display:flex; overflow-x:auto; padding:14px 0;}
    .admin-brand{display:none;}
    .admin-nav-item{white-space:nowrap; border-left:none; border-bottom:3px solid transparent;}
    .admin-main{padding:20px;}
  }

  /* ---------- PHONE-TUNED RESPONSIVE ---------- */
  @media (max-width:640px){
    .container{padding:0 16px;}
    .header-row{height:64px; gap:10px;}
    .brand-text{font-size:24px; letter-spacing:.04em;}
    .header-icons{gap:6px;}
    .lang-toggle{transform:scale(.9);}
    .hero-text{padding:32px 18px; gap:14px;}
    .hero-title{font-size:28px;}
    .hero-sub{font-size:14px; max-width:100%;}
    .hero-cta{gap:10px;}
    .btn{padding:12px 20px; font-size:12.5px;}
    .section{padding:44px 0;}
    .section-title{font-size:22px;}

/* ---------- STORAGE HELPERS ----------
   Ce site fonctionne comme un fichier autonome (ouvert localement ou hébergé
   sur n'importe quel serveur web classique). Les données (produits, commandes,
   réglages) sont sauvegardées dans une vraie base de données du navigateur
   (IndexedDB — capacité très large, largement suffisante pour un nombre
   illimité de produits avec images). Rien n'est jamais supprimé automatiquement :
   les données restent enregistrées sur l'appareil tant que le gérant ne les
   supprime pas lui-même (bouton supprimer produit, ou vidage manuel du
   stockage du navigateur). Un secours en mémoire est utilisé uniquement si le
   navigateur bloque totalement le stockage (rare, certains modes privés). */

const MEMORY_FALLBACK = {};

const IDB_NAME = "meeverse_db";

const IDB_STORE = "kv";

let _idbPromise = null;

function openIDB(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve)=>{
    if(!window.indexedDB){ resolve(null); return; }
    try{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:"key"});
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
  return _idbPromise;
}

const LocalStore = {
  // Lit depuis IndexedDB en priorité (stockage principal, grande capacité).
  // Si vide, se rabat sur l'ancienne clé localStorage (migration automatique
  // et transparente depuis une version précédente du site), puis sur la mémoire.
  async get(key){
    try{
      const db = await openIDB();
      if(db){
        const val = await new Promise((resolve,reject)=>{
          const tx = db.transaction(IDB_STORE,"readonly");
          const rq = tx.objectStore(IDB_STORE).get(key);
          rq.onsuccess = ()=> resolve(rq.result ? rq.result.value : undefined);
          rq.onerror = ()=> reject(rq.error);
        });
        if(val!==undefined) return val;
      }
    }catch(e){ /* on tente le stockage de secours */ }
    try{
      const v = window.localStorage.getItem("meeverse_"+key);
      return v===null ? undefined : v;
    }catch(e){ return MEMORY_FALLBACK[key]; }
  },
  async set(key, value){
    MEMORY_FALLBACK[key] = value;
    try{
      const db = await openIDB();
      if(db){
        await new Promise((resolve,reject)=>{
          const tx = db.transaction(IDB_STORE,"readwrite");
          tx.objectStore(IDB_STORE).put({key, value});
          tx.oncomplete = ()=> resolve();
          tx.onerror = ()=> reject(tx.error);
        });
        return;
      }
    }catch(e){ /* on tente le stockage de secours */ }
    try{ window.localStorage.setItem("meeverse_"+key, value); }
    catch(e){ /* déjà conservé en mémoire ci-dessus */ }
  }
};

/* ---------- CLOUD DATABASE (Firebase / Firestore, optionnel) ----------
   Si le gérant connecte un projet Firebase depuis l'onglet "Base de données"
   du panneau d'administration, les produits/commandes/réglages sont
   synchronisés en temps réel via Firestore : visibles et modifiables depuis
   n'importe quel appareil, pas seulement le navigateur local. Sans connexion
   Firebase, le site continue de fonctionner normalement avec IndexedDB. */

async function initFirebaseFromConfig(config){
  if(!config || !config.apiKey || !config.projectId) return false;
  try{
    if(typeof firebase === "undefined") return false;
    fsApp = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(config);
    fsDB = firebase.firestore();
    CLOUD_READY = true;
    return true;
  }catch(e){ console.warn("Firebase init failed", e); CLOUD_READY = false; return false; }
}
// Écrit en masse UNIQUEMENT lors du tout premier chargement d'une collection
// cloud vide (aucune suppression possible ici, donc aucun risque).

async function seedCollectionToCloud(colName, items){
  if(!CLOUD_READY || !items.length) return;
  try{
    const batch = fsDB.batch();
    items.forEach(it=> batch.set(fsDB.collection(colName).doc(String(it.id)), it));
    await batch.commit();
  }catch(e){ console.warn("Cloud seed failed for "+colName, e); }
}
// Écrit UNIQUEMENT le document concerné (ajout/modification) — jamais toute
// la collection — pour qu'un appareil avec des données locales incomplètes
// ne puisse jamais supprimer par erreur les éléments ajoutés ailleurs.

async function pushDocToCloud(colName, item){
  if(!CLOUD_READY) return;
  try{ await fsDB.collection(colName).doc(String(item.id)).set(item); }
  catch(e){ console.warn("Cloud sync failed for "+colName, e); showToast(t('cloud_sync_failed')); }
}

async function deleteDocFromCloud(colName, id){
  if(!CLOUD_READY) return;
  try{ await fsDB.collection(colName).doc(String(id)).delete(); }
  catch(e){ console.warn("Cloud delete failed for "+colName, e); showToast(t('cloud_sync_failed')); }
}

async function pushSettingsToCloud(){
  if(!CLOUD_READY) return;
  try{ await fsDB.collection("meta").doc("settings").set(SETTINGS); }
  catch(e){ console.warn("Cloud sync failed for settings", e); }
}

function attachCloudListeners(){
  if(!CLOUD_READY || _cloudListenersAttached) return;
  _cloudListenersAttached = true;
  fsDB.collection("products").onSnapshot(async snap=>{
    snap.docChanges().forEach(change=>{
      const data = change.doc.data();
      if(change.type==="removed"){
        PRODUCTS = PRODUCTS.filter(p=>p.id!==data.id);
      }else{
        const idx = PRODUCTS.findIndex(p=>p.id===data.id);
        if(idx>=0) PRODUCTS[idx] = data; else PRODUCTS.push(data);
      }
    });
    await LocalStore.set("products", JSON.stringify(PRODUCTS));
    render();
  }, err=>console.warn("products listener error", err));
  fsDB.collection("orders").onSnapshot(async snap=>{
    snap.docChanges().forEach(change=>{
      const data = change.doc.data();
      if(change.type==="removed"){
        ORDERS = ORDERS.filter(o=>o.id!==data.id);
      }else{
        const idx = ORDERS.findIndex(o=>o.id===data.id);
        if(idx>=0) ORDERS[idx] = data; else ORDERS.unshift(data);
      }
    });
    await LocalStore.set("orders", JSON.stringify(ORDERS));
    render();
  }, err=>console.warn("orders listener error", err));
  fsDB.collection("meta").doc("settings").onSnapshot(async doc=>{
    if(doc.exists){
      SETTINGS = {...SETTINGS, ...doc.data()};
      await LocalStore.set("settings", JSON.stringify(SETTINGS));
      render();
    }
  }, err=>console.warn("settings listener error", err));
}

function parseFirebaseConfigSnippet(text){
  const fields = ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","measurementId"];
  const cfg = {};
  fields.forEach(f=>{
    const re = new RegExp(f+"\\s*:\\s*[\"']([^\"']+)[\"']");
    const m = text.match(re);
    if(m) cfg[f] = m[1];
  });
  return cfg;
}


async function loadData(){
  const s = await LocalStore.get("settings");
  if(s){
    SETTINGS = JSON.parse(s);
    if(!SETTINGS.deliveryCompany) SETTINGS.deliveryCompany = DEFAULT_SETTINGS.deliveryCompany;
    if(!SETTINGS.deliveryPrices) SETTINGS.deliveryPrices = DEFAULT_SETTINGS.deliveryPrices;
    if(!SETTINGS.delivery48hr) SETTINGS.delivery48hr = DEFAULT_SETTINGS.delivery48hr;
  }else{
    SETTINGS = {...DEFAULT_SETTINGS};
    SETTINGS.adminPasswordHash = await sha256("admin123");
  }
  const p = await LocalStore.get("products");
  PRODUCTS = p ? JSON.parse(p) : DEFAULT_PRODUCTS_SEED.map(p=>({...p}));
  const o = await LocalStore.get("orders");
  ORDERS = o ? JSON.parse(o) : [];

  // Firestore est la source de vérité (accessible depuis tous les appareils),
  // IndexedDB reste un cache local pour un chargement rapide / hors-ligne.
  // La configuration intégrée (BUILTIN_FIREBASE_CONFIG) connecte automatiquement
  // TOUS les appareils (gérant et visiteurs) ; une config enregistrée depuis
  // le panneau d'administration peut la remplacer si besoin.
  const fbConfigRaw = await LocalStore.get("firebaseConfig");
  const fbConfig = fbConfigRaw ? JSON.parse(fbConfigRaw) : BUILTIN_FIREBASE_CONFIG;
  if(fbConfig){
    try{
      const ok = await initFirebaseFromConfig(fbConfig);
      if(ok){
        const prodSnap = await fsDB.collection("products").get();
        if(!prodSnap.empty) PRODUCTS = prodSnap.docs.map(d=>d.data());
        else if(PRODUCTS.length) await seedCollectionToCloud("products", PRODUCTS);

        const ordSnap = await fsDB.collection("orders").get();
        if(!ordSnap.empty) ORDERS = ordSnap.docs.map(d=>d.data());
        else if(ORDERS.length) await seedCollectionToCloud("orders", ORDERS);

        const setDoc = await fsDB.collection("meta").doc("settings").get();
        if(setDoc.exists) SETTINGS = {...SETTINGS, ...setDoc.data()};
        else await pushSettingsToCloud();

        attachCloudListeners();
      }
    }catch(e){ console.warn("Cloud config invalid", e); }
  }

  // Réécrit immédiatement dans IndexedDB : migre toute donnée récupérée
  // depuis l'ancien localStorage (ou le cloud), ou enregistre les valeurs par défaut.
  await LocalStore.set("settings", JSON.stringify(SETTINGS));
  await LocalStore.set("products", JSON.stringify(PRODUCTS));
  await LocalStore.set("orders", JSON.stringify(ORDERS));
}

async function saveSettings(){ await LocalStore.set("settings", JSON.stringify(SETTINGS)); await pushSettingsToCloud(); }

async function saveProducts(){ await LocalStore.set("products", JSON.stringify(PRODUCTS)); }

async function saveOrders(){ await LocalStore.set("orders", JSON.stringify(ORDERS)); }


async function connectFirebase(e){
  e.preventDefault();
  const raw = e.target.fbsnippet.value.trim();
  const cfg = parseFirebaseConfigSnippet(raw);
  if(!cfg.apiKey || !cfg.projectId){
    showToast(t('database_invalid'));
    return;
  }
  await LocalStore.set("firebaseConfig", JSON.stringify(cfg));
  const ok = await initFirebaseFromConfig(cfg);
  if(ok){
    const prodSnap = await fsDB.collection("products").get();
    if(!prodSnap.empty) PRODUCTS = prodSnap.docs.map(d=>d.data());
    else if(PRODUCTS.length) await seedCollectionToCloud("products", PRODUCTS);

    const ordSnap = await fsDB.collection("orders").get();
    if(!ordSnap.empty) ORDERS = ordSnap.docs.map(d=>d.data());
    else if(ORDERS.length) await seedCollectionToCloud("orders", ORDERS);

    const setDoc = await fsDB.collection("meta").doc("settings").get();
    if(setDoc.exists) SETTINGS = {...SETTINGS, ...setDoc.data()};
    else await pushSettingsToCloud();

    await LocalStore.set("products", JSON.stringify(PRODUCTS));
    await LocalStore.set("orders", JSON.stringify(ORDERS));
    await LocalStore.set("settings", JSON.stringify(SETTINGS));
    attachCloudListeners();
    showToast(t('database_connected_msg'));
    render();
  }else{
    showToast(t('database_invalid'));
  }
}

async function disconnectFirebase(){
  await LocalStore.set("firebaseConfig", "");
  CLOUD_READY = false;
  showToast(t('database_disconnected_msg'));
  render();
}



async function sha256(str){
  try{
    if(window.crypto && window.crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){ /* fall through to backup hash below */ }
  // Solution de secours si le navigateur bloque l'API de chiffrement (ex: page non sécurisée)
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h1>>>0).toString(16) + (h2>>>0).toString(16);
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function loadImageEl(dataUrl){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}
// Redimensionne et compresse automatiquement chaque photo avant stockage
// (les photos de téléphone peuvent peser plusieurs Mo, alors que Firestore
// limite chaque produit à 1 Mo) : ceci garantit que les produits ajoutés
// se synchronisent toujours correctement sur tous les appareils.

async function compressImageFile(file, maxDim=1280, quality=0.78){
  const dataUrl = await fileToBase64(file);
  if(!file.type || !file.type.startsWith("image/")) return dataUrl;
  try{
    const img = await loadImageEl(dataUrl);
    let {width, height} = img;
    if(width>maxDim || height>maxDim){
      if(width>height){ height = Math.round(height*(maxDim/width)); width = maxDim; }
      else{ width = Math.round(width*(maxDim/height)); height = maxDim; }
    }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);
    return canvas.toDataURL("image/jpeg", quality);
  }catch(e){ return dataUrl; }
}

/*
 * Envoie une commande vers l'API 48HR Livraison (plateforme Ecotrack).
 * SÉCURITÉ : l'appel ne se fait PAS directement vers 48HR depuis le navigateur.
 * Il passe par une fonction Netlify (/api/send-to-48hr) qui détient le jeton API
 * en toute sécurité côté serveur (variable d'environnement ECOTRACK_API_TOKEN).
 * Voir netlify/functions/send-to-48hr.js.
 */

async function sendOrderTo48HR(orderId, silent){
  const order = ORDERS.find(o=>o.id===orderId);
  if(!order) return;
  const cfg = SETTINGS.delivery48hr;
  if(!cfg || !cfg.connected){ if(!silent) showToast(t('e48hr_not_connected_err')); return; }

  order.shipping48hr = order.shipping48hr || {};
  order.shipping48hr.sending = true;
  render();

  const productList = order.items.map(it=>`${it.name} x${it.qty}`).join(", ");
  const wilayaCodeNum = order.customer.wilayaCode ? parseInt(order.customer.wilayaCode, 10) : null;

  const payload = {
    reference: order.id,
    nomClient: order.customer.name,
    telephone: order.customer.phone,
    adresse: order.customer.address,
    commune: order.customer.commune || "",
    codeWilaya: wilayaCodeNum,
    montant: order.total,
    remarque: order.customer.notes || "",
    produit: productList,
    type: 1,      // 1 = Livraison
    stopDesk: 0   // 0 = à domicile
  };

  try{
    const res = await fetch("/api/send-to-48hr", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(()=> ({}));
    if(!res.ok) throw new Error(data && data.error ? data.error : ("HTTP "+res.status));
    order.shipping48hr = {
      sent:true, sending:false, error:"",
      trackingId: (data && (data.tracking || data.Tracking || data.trackingId || (data.order && data.order.tracking))) || order.id,
      sentAt: new Date().toISOString()
    };
    if(!silent) showToast(t('sent_48hr_ok'));
  }catch(err){
    order.shipping48hr = { ...order.shipping48hr, sending:false, sent:false, error: String(err && err.message || err) };
    if(!silent) showToast(t('sent_48hr_err'));
  }
  await saveOrders();
  await pushDocToCloud("orders", order);
  render();
}

async function changePassword(e){
  e.preventDefault();
  const f = e.target;
  const cur = f.current.value, np = f.newp.value, cf = f.confirm.value;
  const curHash = await sha256(cur);
  if(curHash !== SETTINGS.adminPasswordHash){ showToast(t('pass_wrong_current')); return; }
  if(np.length<6){ showToast(t('pass_too_short')); return; }
  if(np!==cf){ showToast(t('pass_mismatch')); return; }
  SETTINGS.adminPasswordHash = await sha256(np);
  await saveSettings();
  f.reset();
  showToast(t('pass_changed'));
}

async function callClaude(systemPrompt, messages){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      system: systemPrompt,
      messages: messages.map(m=>({role:m.role, content:m.content}))
    })
  });
  const data = await res.json();
  const textBlock = (data.content||[]).find(b=>b.type==="text");
  if(!textBlock) throw new Error("no text");
  return textBlock.text;
}


function render(){
  document.getElementById("htmlRoot").setAttribute("lang", LANG);
  document.getElementById("htmlRoot").setAttribute("dir", LANG==="ar"?"rtl":"ltr");

  if(!ADMIN_LOGGED_IN){
    document.getElementById("app").innerHTML = renderAdminLogin();
    return;
  }
  document.getElementById("app").innerHTML = renderAdmin() + `<div class="toast ${TOAST_MSG?'show':''}" id="toastEl">${esc(TOAST_MSG)}</div>`;
  if(TOAST_MSG){ requestAnimationFrame(()=>{ const el=document.getElementById("toastEl"); if(el) el.classList.add("show"); }); }
}

/* ================= INIT ================= */
// Sépare la lecture des données (partagées avec le site via Firestore / IndexedDB)
// de la sécurité : au tout premier lancement de ce tableau de bord séparé, le mot
// de passe gérant est réinitialisé une seule fois vers une nouvelle valeur par
// défaut, puis synchronisé sur tous les appareils. Modifiable ensuite dans
// l'onglet "Sécurité".
async function ensureAdminPasswordMigrated(){
  if(!SETTINGS._pwMigratedMeeverse26){
    SETTINGS.adminPasswordHash = await sha256("meeverse26");
    SETTINGS._pwMigratedMeeverse26 = true;
    await saveSettings();
  }
}

(async function init(){
  document.getElementById("app").innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--green-950);color:var(--beige-50);font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.08em;">MEEVERSE — ADMIN</div>`;
  try{
    await loadData();
    await ensureAdminPasswordMigrated();
    render();
  }catch(e){
    console.error("Meeverse admin init error:", e);
    SETTINGS = {...DEFAULT_SETTINGS};
    PRODUCTS = DEFAULT_PRODUCTS_SEED.map(p=>({...p}));
    ORDERS = [];
    try{
      SETTINGS.adminPasswordHash = await sha256("meeverse26");
    }catch(e2){}
    render();
  }
})();

</script>
